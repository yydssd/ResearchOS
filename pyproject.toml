[project]
name = "research-os"
version = "0.1.0"
description = "A reliable research system for technical and scientific work: traceable conclusions from canonical sources."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
research-os = "research_os.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# basetemp must stay inside the repo: the OS temp dir is not writable in this
# environment (Windows sandbox), which breaks every tmp_path fixture.
addopts = "-q --basetemp=.pytest_tmp"
